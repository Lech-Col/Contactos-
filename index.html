<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">

</head>
<body>
    <div class="padre">
        <h2>Iniciar sesión</h2>
        <div class="titulo">
            <p>Por favor, ingresa tus datos</p>
        </div>
        <div style="width:100%;">
            <h4>Usuario</h4>
            <input type="text" id="usuario" name="usuario" placeholder="Digite usuario" />
        </div>
        <div style="width:100%;">
            <h4>Contraseña</h4>
            <input type="password" id="contraseña" name="contraseña" placeholder="Digite contraseña" />
        </div>
        <div class="texto">
            ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
        </div>
        <button type="submit">Iniciar sesión</button>
    </div>
</body>
</html>
